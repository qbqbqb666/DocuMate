# Include inside the existing port-80 server block.
location = /documate {
    return 301 /documate/;
}

location ^~ /documate/downloads/ {
    alias /var/www/documate/downloads/;
    autoindex off;
    add_header Content-Disposition "attachment" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}

location ^~ /documate/ {
    alias /var/www/documate/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET HEAD { deny all; }
}
