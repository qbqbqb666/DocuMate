<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuMate · 数据看板</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <section id="login" class="login-screen">
    <form id="login-form" class="login-card">
      <div class="brand-icon"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#1E3A8A"/><path d="M14 11.5h12.4c5.3 0 9.6 4.3 9.6 9.6v5.8c0 5.3-4.3 9.6-9.6 9.6H14V11.5Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 11.5v25M19.5 18h10M19.5 23.5h10M19.5 29h7" stroke="white" stroke-width="2.3" stroke-linecap="round"/><path d="M30 11.5v7.7h5.8" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
      <h1 class="login-wordmark">Docu<span>Mate.</span></h1>
      <label for="username">管理员账号</label><input id="username" autocomplete="username" required maxlength="128">
      <label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256">
      <p id="login-error" class="error" role="alert"></p>
      <button id="login-button" type="submit" class="primary">登录</button>
    </form>
  </section>
  <div id="board" hidden>
    <header><div class="brand"><span class="brand-icon small"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#1E3A8A"/><path d="M14 11.5h12.4c5.3 0 9.6 4.3 9.6 9.6v5.8c0 5.3-4.3 9.6-9.6 9.6H14V11.5Z" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><path d="M14 11.5v25M19.5 18h10M19.5 23.5h10M19.5 29h7" stroke="white" stroke-width="2.3" stroke-linecap="round"/><path d="M30 11.5v7.7h5.8" stroke="white" stroke-width="2.5" stroke-linejoin="round"/></svg></span><span class="header-wordmark">Docu<span>Mate.</span></span></div>
      <div class="header-actions"><span id="admin-name"></span><button id="logout">退出</button></div>
    </header>
    <main>
      <div class="intro">
        <div class="sync"><span id="updated" class="muted" aria-live="polite">正在读取…</span><button id="refresh">↻ 手动刷新</button></div>
      </div>
      <p id="board-error" class="error" role="alert" hidden></p>
      <section class="metrics" aria-label="统计概览">
        <article><div class="metric-top"><span>用户规模</span><b aria-hidden="true">01 / USERS</b></div><span>注册用户总数</span><strong id="total-users">—</strong><small>所有已注册账号</small></article>
        <article><div class="metric-top"><span>账号状态</span><b aria-hidden="true">02 / ACTIVE</b></div><span>可用账号</span><strong id="active-users">—</strong><small>状态为 active</small></article>
        <article><div class="metric-top"><span>每日增长</span><b aria-hidden="true">03 / TODAY</b></div><span>今日新增用户</span><strong id="today-users">—</strong><small>北京时间 00:00 起</small></article>
      </section>
      <section class="data-panel">
        <div class="panel-toolbar"><nav aria-label="数据类型"><button class="tab selected" id="users-tab">用户列表 <span id="users-count">0</span></button></nav>
          <form id="search-form"><input id="search" type="search" placeholder="按用户名搜索" aria-label="按用户名搜索" maxlength="128"><button type="submit">搜索</button></form>
        </div>
        <div class="table-scroll"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div>
        <div class="panel-footer"><span id="page-info" class="muted"></span><div><button id="previous">← 上一页</button><button id="next">下一页 →</button></div></div>
      </section>
      <section class="hash-panel" aria-labelledby="hash-heading">
        <div class="hash-heading"><div class="tool-icon" aria-hidden="true">#</div><div><span class="eyebrow">UTILITY / ARGON2ID</span><h2 id="hash-heading">密码转哈希</h2></div></div>
        <form id="hash-form"><div class="hash-controls"><input id="hash-password" aria-label="待转换的密码" type="password" autocomplete="new-password" minlength="6" maxlength="128" required placeholder="输入 6 至 128 个字符"><button id="hash-generate" type="submit">生成哈希</button></div></form>
        <p id="hash-message" class="muted" role="status"></p>
        <div id="hash-result" hidden><label for="hash-output">生成结果（完整复制）</label><textarea id="hash-output" readonly rows="3" spellcheck="false"></textarea><div class="hash-actions"><button id="hash-copy" type="button">复制哈希</button><button id="hash-clear" type="button">清空</button></div></div>
      </section>
    </main>
  </div>
</body>
</html>
