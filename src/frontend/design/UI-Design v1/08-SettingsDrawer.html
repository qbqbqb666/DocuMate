<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuMate · 08 SettingsDrawer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .anim-slide-right { animation: slideInRight 320ms cubic-bezier(0.2,0,0,1) backwards; }
    .anim-overlay { animation: fadeIn 200ms ease-out backwards; }
    .anim-fade-up { animation: fadeInUp 240ms cubic-bezier(0.2,0,0,1) backwards; }
    .card-1 { animation-delay: 60ms; } .card-2 { animation-delay: 120ms; } .card-3 { animation-delay: 180ms; }
    .card-4 { animation-delay: 240ms; } .card-5 { animation-delay: 300ms; }
  </style>
</head>
<body class="bg-slate-50">

  <!-- 模拟主界面背景 -->
  <div class="fixed inset-0 bg-gradient-to-br from-slate-50 to-slate-100"></div>
  <div class="fixed top-5 left-5 text-xs text-slate-400">主界面 (虚化模拟)</div>

  <!-- 遮罩 -->
  <div class="fixed inset-0 z-40 bg-black/30 backdrop-blur-sm anim-overlay"></div>

  <!-- Drawer: 右侧 420px -->
  <aside class="anim-slide-right fixed top-0 right-0 z-50 h-full w-[420px] bg-white shadow-2xl flex flex-col">

    <!-- 顶部 用户卡 -->
    <div class="relative p-6 pb-5 border-b border-slate-100"
         style="background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);">
      <button onclick="location.href='06-MainWorkspace.html'" title="关闭设置" class="absolute top-4 right-4 p-1.5 hover:bg-white/60 rounded-lg text-slate-500">
        <i data-lucide="x" style="width:16px;height:16px;stroke-width:2;"></i>
      </button>

      <div class="flex items-center gap-4 mb-4">
        <div class="w-16 h-16 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-lg"
             style="background: #1e3a8a;">Q</div>
        <div class="min-w-0 flex-1">
          <div class="text-slate-900 text-base font-semibold truncate">qbqb</div>
          <div class="text-slate-500 text-sm truncate">qbqb@example.com</div>
          <div class="text-slate-400 text-xs mt-0.5">已加入 12 天</div>
        </div>
      </div>

      <!-- mini 统计 -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-white/60 rounded-lg py-2">
          <div class="text-slate-900 text-base font-bold">8</div>
          <div class="text-slate-500 text-[10px] mt-0.5">文档</div>
        </div>
        <div class="bg-white/60 rounded-lg py-2">
          <div class="text-slate-900 text-base font-bold">142</div>
          <div class="text-slate-500 text-[10px] mt-0.5">对话</div>
        </div>
        <div class="bg-white/60 rounded-lg py-2">
          <div class="text-slate-900 text-base font-bold">12.4k</div>
          <div class="text-slate-500 text-[10px] mt-0.5">tokens</div>
        </div>
      </div>
    </div>

    <!-- 中部 分组卡片 -->
    <div class="flex-1 overflow-y-auto p-4 space-y-3">

      <!-- 账号 -->
      <div class="anim-fade-up card-1 bg-slate-50 rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="user" class="text-slate-600" style="width:16px;height:16px;stroke-width:1.8;"></i>
          <span class="text-sm font-semibold text-slate-900">账号</span>
        </div>
        <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
          <span>修改昵称</span><i data-lucide="chevron-right" class="text-slate-400" style="width:14px;height:14px;"></i>
        </button>
        <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
          <span>修改密码</span><i data-lucide="chevron-right" class="text-slate-400" style="width:14px;height:14px;"></i>
        </button>
        <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
          <span>修改邮箱</span><i data-lucide="chevron-right" class="text-slate-400" style="width:14px;height:14px;"></i>
        </button>
      </div>

      <!-- API Key -->
      <div class="anim-fade-up card-2 bg-slate-50 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <i data-lucide="key" class="text-slate-600" style="width:16px;height:16px;stroke-width:1.8;"></i>
            <span class="text-sm font-semibold text-slate-900">API Key</span>
          </div>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">已配置</span>
        </div>
        <div class="text-sm text-slate-700 px-2 mb-2">SiliconFlow · sk-•••••<span class="text-slate-500 font-mono">7K2A</span></div>
        <div class="flex gap-2 mt-2">
          <button onclick="location.href='04-ApiKeyModal.html'" class="flex-1 px-3 py-1.5 bg-white border border-slate-200 hover:bg-slate-50 rounded-md text-xs text-slate-700">更换 Key</button>
          <button onclick="prototypeToast('API Key 删除确认已打开')" class="flex-1 px-3 py-1.5 bg-white border border-rose-200 hover:bg-rose-50 rounded-md text-xs text-rose-600">删除</button>
        </div>
      </div>

      <!-- 使用统计 -->
      <div class="anim-fade-up card-4 bg-slate-50 rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="bar-chart-3" class="text-slate-600" style="width:16px;height:16px;stroke-width:1.8;"></i>
          <span class="text-sm font-semibold text-slate-900">使用统计</span>
        </div>
        <div class="space-y-1.5 text-sm">
          <div class="flex justify-between px-2"><span class="text-slate-500">本月 LLM tokens</span><span class="text-slate-800 font-mono">12,432</span></div>
          <div class="flex justify-between px-2"><span class="text-slate-500">本月 Embedding</span><span class="text-slate-800 font-mono">3,210</span></div>
          <div class="flex justify-between px-2"><span class="text-slate-500">本月 Vision</span><span class="text-slate-800 font-mono">87</span></div>
          <div class="flex justify-between px-2"><span class="text-slate-500">PDF 渲染次数</span><span class="text-slate-800 font-mono">14</span></div>
        </div>
        <button onclick="prototypeToast('使用统计详情已展开')" class="w-full text-center text-xs text-blue-800 hover:underline mt-2.5">查看详细 →</button>
      </div>

      <!-- 关于 -->
      <div class="anim-fade-up card-5 bg-slate-50 rounded-2xl p-4">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="info" class="text-slate-600" style="width:16px;height:16px;stroke-width:1.8;"></i>
          <span class="text-sm font-semibold text-slate-900">关于</span>
        </div>
        <div class="space-y-1.5">
          <div class="flex justify-between px-2 text-sm"><span class="text-slate-500">版本</span><span class="text-slate-700 font-mono">v0.4.0</span></div>
          <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
            <span>GitHub 仓库</span><i data-lucide="external-link" class="text-slate-400" style="width:14px;height:14px;"></i>
          </button>
          <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
            <span>反馈 / Bug Report</span><i data-lucide="external-link" class="text-slate-400" style="width:14px;height:14px;"></i>
          </button>
          <button class="w-full flex items-center justify-between px-2 py-1.5 hover:bg-white rounded-md text-sm text-slate-700">
            <span>开发者文档</span><i data-lucide="external-link" class="text-slate-400" style="width:14px;height:14px;"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- 底部 退出登录 -->
    <div class="p-4 border-t border-slate-100">
      <button onclick="location.href='01-LoginPage.html'" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 rounded-xl border border-rose-200 transition">
        <i data-lucide="log-out" style="width:16px;height:16px;stroke-width:1.8;"></i>
        <span>退出登录</span>
      </button>
    </div>
  </aside>

  <script>
    lucide.createIcons();
    document.querySelectorAll('aside button').forEach(button => {
      if (button.hasAttribute('onclick')) return;
      button.addEventListener('click', () => {
        const label = button.textContent.trim().replace(/\s+/g, ' ');
        prototypeToast(`${label}：交互面板已打开`);
      });
    });
  </script>
  <script src="prototype-kit.js"></script>
</body>
</html>
